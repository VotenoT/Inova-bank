<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inova</title>
<script>window.__inovaB64="";</script>
<script src="parts/part00.js"></script>
<script src="parts/part01.js"></script>
<script src="parts/part02.js"></script>
<script src="parts/part03.js"></script>
<script src="parts/part04.js"></script>
<script src="parts/part05.js"></script>
<script src="patch-v103.js"></script>
<script>
(() => {
  try {
    const binary = atob(window.__inovaB64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    let html = new TextDecoder("utf-8").decode(bytes);
    if (window.InovaPatch && typeof window.InovaPatch.apply === "function") {
      html = window.InovaPatch.apply(html);
    }
    html = html.replace(
      '<div class="brand"><div class="logo">I</div><div>INOVA<span style="font-weight:400">bank</span></div></div>',
      '<div class="brand"><img class="logo-img" src="logo.jpg" alt="Logo Inova"><div>INOVA<span style="font-weight:400">bank</span></div></div>'
    );
    html = html.replace('</style>', '.logo-img{width:44px;height:44px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}\n</style>');
    html = html.replace('</head>', '<link rel="stylesheet" href="enhancements.css">\n</head>');
    html = html.replace('</body>', '<script src="enhancements.js"><\/script>\n</body>');
    window.__inovaB64 = "";
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = "<pre>Falha ao carregar o Inova: " + String(error && error.message || error) + "</pre>";
  }
})();
</script>
</head>
<body></body>
</html>
