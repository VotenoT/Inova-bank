name: Apply InovaBank ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/inova.zip.b64.part* | base64 -d > /tmp/InovaBank-v1.0.0.zip
          echo "5403773e8f9c5e6fb88eaa1610fbaf1fe6de70b40c507efc92cd589f51e5720f  /tmp/InovaBank-v1.0.0.zip" | sha256sum -c -
          rm -rf /tmp/inova-unpack
          mkdir -p /tmp/inova-unpack
          unzip -q /tmp/InovaBank-v1.0.0.zip -d /tmp/inova-unpack
          test -f /tmp/inova-unpack/InovaBank/app/src/main/assets/index.html

      - name: Apply project files to repository root
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/inova-unpack/InovaBank/. .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-project.yml

      - name: Commit applied project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply InovaBank v1.0.0 project"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InovaBank-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
